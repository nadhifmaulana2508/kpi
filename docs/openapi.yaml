      properties:
        position_id:
          type: string
        org_unit_id:
          type: string
        supervisor_employee_id:
          type: [string, 'null']
        starts_at:
          type: string
          format: date
    UpdateAssignmentRequest:
      type: object
      minProperties: 1
      properties:
        supervisor_employee_id:
          type: [string, 'null']
        ends_at:
          type: [string, 'null']
          format: date
    KpiDefinitionsEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/KpiDefinition'
        meta:
          $ref: '#/components/schemas/PageMeta'
    KpiDefinitionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/KpiDefinition'
    KpiDefinitionDraftRequest:
      type: object
      required: [code, name, group, position_id, type, definition, unit, data_source]
      properties:
        code:
          type: string
        name:
          type: string
        group:
          type: string
