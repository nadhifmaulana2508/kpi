openapi: 3.2.1
info:
  title: KPI Perbankan API
  version: 0.1.0-draft
  summary: Kontrak REST API untuk demo sistem KPI
  description: |
    Draft kontrak API untuk frontend SvelteKit dan backend Laravel.
    Contoh request untuk alur demo tersedia di api_examples.md.

    Semua data bisnis untuk demo bersifat sintetis. Katalog demo adalah
    placeholder, bukan salinan definisi workbook. Development lokal memakai
    cookie sesi Laravel dan selector identitas sintetis. MVP demo memakai user
    dummy; callback SSO merupakan tahap integrasi lanjutan. Data dan objek
    bertanda demo_only tidak boleh masuk produksi. UAT hanya boleh memakai
    dataset sintetis pada lingkungan yang terisolasi.

    Browser yang memakai sesi cookie harus mengirim credentials dan Origin
    dari domain yang diizinkan. Semua request mutasi wajib membawa
    X-XSRF-TOKEN yang cocok dengan cookie XSRF-TOKEN dari
    /sanctum/csrf-cookie. Laravel menolak request tanpa CSRF yang sah.
    Endpoint mutasi MVP mencantumkan parameter CsrfToken. Endpoint mutasi
    lanjutan mengikuti aturan yang sama. Setiap operasi memiliki extension
    x-implementation-status: implemented untuk route Laravel yang tersedia,
    atau planned untuk endpoint tahap berikutnya.
servers:
  - url: http://localhost:8000/api/v1
    description: Laravel API lokal
tags:
  - name: Demo session
  - name: Context
  - name: Organization
  - name: KPI catalog
  - name: Cycles
  - name: Contracts
  - name: Reviews
  - name: Appeals
  - name: Reports
  - name: Audit
security:
  - laravelSession: []
x-authentication-by-environment:
  local: laravelSession
  uat: laravelSession
  production: disabled
paths:
  /demo/identities:
    get:
      x-implementation-status: implemented
      tags: [Demo session]
      summary: Ambil daftar identitas demo
      description: Endpoint local development saja. Tidak tersedia di UAT atau produksi.
      x-environment: local-only
      security: []
      responses:
        '200':
          description: Daftar identitas sintetis yang dapat dipilih
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoIdentitiesEnvelope'
        '403':
          $ref: '#/components/responses/Error'
  /demo/session:
    post:
      x-implementation-status: implemented
      tags: [Demo session]
      summary: Pilih identitas demo
      description: |
        Endpoint local development saja. Endpoint harus ditolak di UAT dan produksi.
        Server membuat session cookie untuk identitas sintetis yang dipilih.
      x-environment: local-only
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoSessionRequest'
      responses:
        '200':
          description: Identitas demo aktif
          headers:
            Set-Cookie:
              description: Cookie session lokal dengan atribut HttpOnly dan SameSite.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserEnvelope'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '419':
          $ref: '#/components/responses/Error'
    delete:
      x-implementation-status: implemented
      tags: [Demo session]
      summary: Akhiri identitas demo
      description: Endpoint local development saja. Endpoint harus ditolak di UAT dan produksi.
      x-environment: local-only
      security:
        - laravelSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Session demo dihapus
        '403':
          $ref: '#/components/responses/Error'
        '419':
          $ref: '#/components/responses/Error'
  /me:
    get:
      x-implementation-status: implemented
      tags: [Context]
      summary: Ambil identitas dan cakupan akses aktif
      responses:
        '200':
          description: Identitas aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserEnvelope'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /dashboard:
    get:
      x-implementation-status: implemented
      tags: [Context]
      summary: Ambil ringkasan dashboard sesuai cakupan akses
      description: Pegawai hanya mendapat hitungan kontrak miliknya. Pimpinan mendapat hitungan kontrak dalam cakupan unitnya; SDM mendapat hitungan lintas unit. Korwil hanya mencakup cabang aktif yang ditetapkan pada penugasan beserta unit di bawah cabang.
      parameters:
        - $ref: '#/components/parameters/CycleId'
      responses:
        '200':
          description: Ringkasan dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardEnvelope'
        default:
          $ref: '#/components/responses/Error'
  /org-units:
    get:
      x-implementation-status: implemented
      tags: [Organization]
      summary: Ambil unit organisasi dalam cakupan akses
      parameters:
        - name: tree
          in: query
          description: True mengembalikan pohon hierarki; false mengembalikan daftar datar.
          schema:
            type: boolean
            default: true
        - name: type
          in: query
          description: Saat tree=true, pilih tipe unit akar dan sertakan turunannya. Saat tree=false, batasi baris ke tipe ini.
          schema:
            $ref: '#/components/schemas/OrgUnitType'
      responses:
        '200':
          description: Daftar unit organisasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnitsEnvelope'
        default:
          $ref: '#/components/responses/Error'
    post:
      x-implementation-status: planned
      tags: [Organization]
      summary: Tambah unit organisasi demo
      description: Hanya SDM demo. Unit yang sudah dipakai tidak dihapus; perubahan struktur dicatat sebagai histori.
      x-required-demo-role: SDM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrgUnitRequest'
      responses:
        '201':
          description: Unit dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnitEnvelope'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /org-units/{orgUnitId}:
    parameters:
      - name: orgUnitId
        in: path
        required: true
        schema:
          type: string
    get:
      x-implementation-status: planned
      tags: [Organization]
      summary: Ambil detail unit organisasi demo
      responses:
        '200':
          description: Detail unit dalam cakupan akses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnitEnvelope'
        default:
          $ref: '#/components/responses/Error'
    patch:
      x-implementation-status: planned
      tags: [Organization]
      summary: Ubah unit organisasi demo
      description: Hanya SDM demo. Perubahan nama atau relasi berlaku mulai tanggal efektif dan tidak mengubah snapshot kontrak lama.
      x-required-demo-role: SDM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrgUnitRequest'
      responses:
        '200':
          description: Unit diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnitEnvelope'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /positions:
    get:
      x-implementation-status: planned
      tags: [Organization]
      summary: Ambil daftar jabatan demo
      responses:
        '200':
          description: Daftar jabatan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionsEnvelope'
        default:
          $ref: '#/components/responses/Error'
    post:
      x-implementation-status: planned
      tags: [Organization]
      summary: Tambah jabatan demo
      description: Hanya SDM demo. Jabatan dibuat aktif; kode jabatan yang sudah terpakai tidak dapat digunakan ulang.
      x-required-demo-role: SDM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePositionRequest'
      responses:
        '201':
          description: Jabatan dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionEnvelope'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /positions/{positionId}:
    parameters:
      - name: positionId
        in: path
        required: true
        schema:
          type: string
    get:
      x-implementation-status: planned
      tags: [Organization]
      summary: Ambil detail jabatan demo
      responses:
        '200':
          description: Detail jabatan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionEnvelope'
        default:
          $ref: '#/components/responses/Error'
    patch:
      x-implementation-status: planned
      tags: [Organization]
      summary: Ubah atau nonaktifkan jabatan demo
      description: Hanya SDM demo. Jabatan yang sudah dipakai penugasan atau kontrak tidak dihapus; perubahan dicatat.
      x-required-demo-role: SDM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePositionRequest'
      responses:
        '200':
          description: Jabatan diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionEnvelope'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /employees:
    get:
      x-implementation-status: planned
      tags: [Organization]
      summary: Cari pegawai demo dalam cakupan akses
      parameters:
        - name: org_unit_id
          in: query
          schema:
            type: string
        - name: position_id
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Daftar pegawai demo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeesPageEnvelope'
        default:
          $ref: '#/components/responses/Error'
    post:
      x-implementation-status: planned
      tags: [Organization]
      summary: Tambah pegawai demo
      description: Hanya SDM demo. Isi hanya nama sintetis dan status kerja; jangan memasukkan PII nyata.
      x-required-demo-role: SDM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '201':
          description: Pegawai dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeEnvelope'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /employees/{employeeId}:
    parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
    get:
      x-implementation-status: planned
      tags: [Organization]
      summary: Ambil detail pegawai demo
      responses:
        '200':
          description: Detail pegawai dalam cakupan akses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeEnvelope'
        default:
          $ref: '#/components/responses/Error'
    patch:
      x-implementation-status: planned
      tags: [Organization]
      summary: Ubah data pegawai demo
      description: Hanya SDM demo. Perubahan dicatat dalam audit event.
      x-required-demo-role: SDM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeRequest'
      responses:
        '200':
          description: Pegawai diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeEnvelope'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /employees/{employeeId}/assignments:
    parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
    get:
      x-implementation-status: planned
      tags: [Organization]
      summary: Ambil riwayat penugasan pegawai demo
      responses:
        '200':
          description: Riwayat penugasan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentsEnvelope'
        default:
          $ref: '#/components/responses/Error'
    post:
      x-implementation-status: planned
      tags: [Organization]
      summary: Tambah penugasan pegawai demo
      description: Hanya SDM demo. Penugasan baru tidak mengubah snapshot kontrak yang sudah dibuat.
      x-required-demo-role: SDM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssignmentRequest'
      responses:
        '201':
          description: Penugasan dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentEnvelope'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /employees/{employeeId}/assignments/{assignmentId}:
    parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
      - name: assignmentId
        in: path
        required: true
        schema:
          type: string
    patch:
      x-implementation-status: planned
      tags: [Organization]
      summary: Tutup atau koreksi penugasan demo
      description: Hanya SDM demo. Penugasan historis tidak dihapus; perubahan dicatat.
      x-required-demo-role: SDM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssignmentRequest'
      responses:
        '200':
          description: Penugasan diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentEnvelope'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /kpi-definitions:
    get:
      x-implementation-status: implemented
      tags: [KPI catalog]
      summary: Ambil katalog KPI
      parameters:
        - name: position_id
          in: query
          schema:
            type: string
        - name: group
          in: query
          schema:
            type: string
            enum: [Bisnis, Operasional, Pendukung dan Kontrol, Kepemimpinan]
        - name: search
          in: query
          schema:
            type: string
            maxLength: 120
        - name: draft
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Katalog indikator dengan status draft atau terbit dalam ruang demo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiDefinitionsEnvelope'
        default:
          $ref: '#/components/responses/Error'
    post:
      x-implementation-status: planned
      tags: [KPI catalog]
      summary: Buat definisi KPI draft
      description: Hanya SDM demo. Definisi baru berstatus draft dan demo_only=true; kontrak demo dapat memakai versi setelah diterbitkan.
      x-required-demo-role: SDM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KpiDefinitionDraftRequest'
      responses:
        '201':
          description: Definisi KPI draft dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiDefinitionEnvelope'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /kpi-definitions/{definitionId}:
    parameters:
      - name: definitionId
        in: path
        required: true
        schema:
          type: string
    get:
      x-implementation-status: implemented
      tags: [KPI catalog]
      summary: Ambil detail definisi KPI dan versinya
      responses:
        '200':
          description: Detail definisi KPI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiDefinitionEnvelope'
        default:
          $ref: '#/components/responses/Error'
    patch:
      x-implementation-status: planned
      tags: [KPI catalog]
      summary: Ubah definisi KPI yang masih draft
      description: Hanya SDM demo. Versi yang sudah diterbitkan tidak dapat diubah; buat versi baru untuk perubahan berikutnya.
      x-required-demo-role: SDM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKpiDefinitionDraftRequest'
      responses:
        '200':
          description: Definisi draft diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiDefinitionEnvelope'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /kpi-definitions/{definitionId}/versions:
    parameters:
      - name: definitionId
        in: path
        required: true
        schema:
          type: string
    post:
      x-implementation-status: planned
      tags: [KPI catalog]
      summary: Buat versi draft dari definisi KPI terbit
      description: Hanya SDM demo. Versi baru menyalin isi versi terbit terakhir dan menyimpan alasan perubahan.
      x-required-demo-role: SDM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKpiVersionRequest'
      responses:
        '201':
          description: Versi draft baru dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiDefinitionEnvelope'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /kpi-definitions/{definitionId}/publish:
    parameters:
      - name: definitionId
        in: path
        required: true
        schema:
          type: string
    post:
      x-implementation-status: planned
      tags: [KPI catalog]
      summary: Terbitkan versi draft KPI
      description: Hanya SDM demo. Versi terbit tetap tidak berubah. Catatan penerbitan berlaku untuk ruang demo saja, menetapkan demo_only=true, dan bukan persetujuan KPI untuk penggunaan produksi.
      x-required-demo-role: SDM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishKpiDefinitionRequest'
      responses:
        '200':
          description: Versi KPI diterbitkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiDefinitionEnvelope'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /cycles:
    get:
      x-implementation-status: implemented
      tags: [Cycles]
      summary: Ambil periode penilaian demo
      responses:
        '200':
          description: Daftar periode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CyclesEnvelope'
        default:
          $ref: '#/components/responses/Error'
    post:
      x-implementation-status: planned
      tags: [Cycles]
      summary: Buat siklus penilaian draft
      description: Hanya SDM demo. Siklus baru selalu berstatus DRAFT dan demo_only=true.
      x-required-demo-role: SDM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCycleRequest'
      responses:
        '201':
          description: Siklus draft dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleEnvelope'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /cycles/{cycleId}:
    parameters:
      - name: cycleId
        in: path
        required: true
        schema:
          type: string
    get:
      x-implementation-status: planned
      tags: [Cycles]
      summary: Ambil detail siklus penilaian
      responses:
        '200':
          description: Detail siklus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleEnvelope'
        default:
          $ref: '#/components/responses/Error'
    patch:
      x-implementation-status: planned
      tags: [Cycles]
      summary: Ubah pengaturan siklus draft
      description: Hanya SDM demo. Pengaturan hanya dapat diubah selama DRAFT dan perubahan dicatat.
      x-required-demo-role: SDM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCycleRequest'
      responses:
        '200':
          description: Siklus draft diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleEnvelope'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /cycles/{cycleId}/open:
    post:
      x-implementation-status: planned
      tags: [Cycles]
      summary: Buka siklus untuk pengisian
      description: Hanya SDM demo. Server memeriksa tanggal dan kesiapan siklus sebelum membuka.
      x-required-demo-role: SDM
      parameters:
        - name: cycleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CycleTransitionRequest'
      responses:
        '200':
          description: Siklus dibuka
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleEnvelope'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /cycles/{cycleId}/close:
    post:
      x-implementation-status: planned
      tags: [Cycles]
      summary: Tutup siklus untuk pengisian
      description: Hanya SDM demo. Alasan penutupan disimpan sebagai audit event.
      x-required-demo-role: SDM
      parameters:
        - name: cycleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CycleTransitionRequest'
      responses:
        '200':
          description: Siklus ditutup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleEnvelope'
