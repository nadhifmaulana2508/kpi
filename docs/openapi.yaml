          type: string
          enum: [ACTIVE, INACTIVE]
    AssignmentsEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
    AssignmentEnvelope:
      type: object
