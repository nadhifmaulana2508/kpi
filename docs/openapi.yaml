          items:
            $ref: '#/components/schemas/OrgUnit'
    OrgUnitType:
      type: string
      enum: [HEAD_OFFICE, DIVISION, DEPARTMENT, SUB_DEPARTMENT, REGION, BRANCH, SECTION]
    PositionsEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Position'
    PositionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Position'
    Position:
      type: object
      required: [id, code, name, group, active]
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        group:
          type: string
          enum: [Bisnis, Operasional, Pendukung dan Kontrol, Kepemimpinan]
        active:
          type: boolean
    CreatePositionRequest:
      type: object
      required: [code, name, group]
      properties:
        code:
          type: string
        name:
          type: string
        group:
          type: string
          enum: [Bisnis, Operasional, Pendukung dan Kontrol, Kepemimpinan]
    UpdatePositionRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        group:
          type: string
          enum: [Bisnis, Operasional, Pendukung dan Kontrol, Kepemimpinan]
        active:
          type: boolean
    EmployeesPageEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Employee'
        meta:
          $ref: '#/components/schemas/PageMeta'
    EmployeeEnvelope:
