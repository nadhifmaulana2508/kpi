components:
  securitySchemes:
    laravelSession:
      type: apiKey
      in: cookie
      name: laravel-session
      description: >-
        Cookie sesi Laravel. Dengan APP_NAME=Laravel, nama default-nya
        laravel-session. SESSION_COOKIE dapat mengganti nama per lingkungan.
        Demo lokal memakai selector identitas sintetis. Integrasi IdP dan
        pemetaan akun uji ke pegawai demo didokumentasikan untuk tahap lanjutan.
  parameters:
    CsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: Nilai cookie XSRF-TOKEN setelah URL decoding. Wajib untuk request mutasi yang memakai sesi cookie.
      schema:
        type: string
    CycleId:
      name: cycle_id
      in: query
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ContractId:
      name: contractId
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Kesalahan API
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    DemoIdentitiesEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DemoIdentity'
    DemoIdentity:
      type: object
      required: [id, display_name, access_role, org_unit_name, self_assignment_available]
      properties:
        id:
          type: string
        display_name:
          type: string
        access_role:
          type: string
        org_unit_name:
          type: string
        self_assignment_available:
          type: boolean
          description: True jika identitas dapat membuat draf KPI untuk dirinya sendiri pada siklus demo bulanan yang terbuka.
    DemoSessionRequest:
      type: object
      required: [identity_id]
      properties:
        identity_id:
          type: string
          description: ID identitas sintetis dari daftar demo yang sudah disediakan.
    CurrentUserEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CurrentUser'
    CurrentUser:
      type: object
      required: [id, employee_id, display_name, access_role, position_name, org_unit_id, org_unit_name, scope_org_unit_ids]
      properties:
        id:
          type: string
        employee_id:
          type: string
        display_name:
          type: string
        access_role:
          type: string
          enum: [SDM, DIREKSI, KEPALA_DIVISI, KEPALA_BIDANG, KEPALA_SUB_BIDANG, KORWIL, KEPALA_CABANG, PEGAWAI]
        position_name:
          type: string
        org_unit_id:
          type: string
        org_unit_name:
          type: string
        scope_org_unit_ids:
          type: array
          description: Unit yang boleh diringkas oleh identitas aktif. Cakupan Korwil berasal dari cabang aktif yang tercatat pada penugasan.
          items:
            type: string
    DashboardEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [cycle, counts, average_final_score, contracts_needing_action]
          properties:
            cycle:
              $ref: '#/components/schemas/Cycle'
            counts:
              type: object
              required: [total_contracts, ready_contracts, submitted_contracts]
              properties:
                total_contracts:
                  type: integer
                ready_contracts:
                  type: integer
                  description: Jumlah kontrak dalam cakupan dengan skor KPI demo yang dapat dihitung saat ini.
                submitted_contracts:
                  type: integer
            average_final_score:
              type: [number, 'null']
              description: Null pada MVP sampai aturan agregasi dan rating disahkan.
            contracts_needing_action:
              type: integer
    OrgUnitsEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrgUnit'
    OrgUnitEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/OrgUnit'
    CreateOrgUnitRequest:
      type: object
      required: [code, name, type, effective_from]
      properties:
        code:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/OrgUnitType'
        parent_id:
          type: [string, 'null']
        effective_from:
          type: string
          format: date
        effective_to:
          type: [string, 'null']
          format: date
    UpdateOrgUnitRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        parent_id:
          type: [string, 'null']
        effective_from:
          type: string
          format: date
        effective_to:
          type: [string, 'null']
          format: date
    OrgUnit:
      type: object
      required: [id, code, name, type, parent_id, children]
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/OrgUnitType'
        parent_id:
          type: [string, 'null']
        effective_from:
          type: [string, 'null']
          format: date
        effective_to:
          type: [string, 'null']
          format: date
        children:
