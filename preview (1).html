function dashboard(){const cards=visibleCards(),ready=cards.filter(c=>calculate(c).ready),avg=ready.length?ready.reduce((a,c)=>a+calculate(c).final,0)/ready.length:null,submitted=cards.filter(c=>c.state==='SUBMITTED').length,groups=['Bisnis','Operasional','Pendukung dan Kontrol'],e=data.employees.find(e=>e.id===activeEmployee);return `<section class="portal-hero"><div><div class="eyebrow">BKK JATENG · RUANG KINERJA PEGAWAI</div><h1>Ringkasan kinerja<br>dan pengisian KPI</h1><p>${esc(e?.name||'Pilih pegawai')} · Pantau capaian, lengkapi realisasi, dan tindak lanjuti penilaian Anda.</p></div><button class="btn gold" onclick="openCard()">Isi realisasi KPI <span aria-hidden="true">→</span></button></section><div class="quick-access"><button class="quick-tile" onclick="openCard()"><span class="portal-icon">${icon('scorecard')}</span><span><strong>Lanjutkan pengisian</strong><small>Satu KPI untuk setiap langkah</small></span></button><button class="quick-tile" onclick="nav('catalog')"><span class="portal-icon">${icon('catalog')}</span><span><strong>Katalog KPI</strong><small>Definisi dan cara mengukur</small></span></button><button class="quick-tile" onclick="nav('reports')"><span class="portal-icon">${icon('reports')}</span><span><strong>Laporan penilaian</strong><small>Rekap dan cadangan data</small></span></button></div><div class="stats">${stat('Kontrak penilaian',cards.length,'Enam KPI pada setiap kontrak','▤')}${stat('Data lengkap',ready.length,'Siap untuk diperiksa','✓')}${stat('Rata-rata nilai',fmt(avg),'Hanya penilaian lengkap','↗',true)}${stat('Menunggu verifikasi',submitted,'Sudah diajukan ke atasan','◷')}</div><div class="grid2"><section class="card"><div class="cardhead"><div><h2>Kelengkapan penilaian</h2><div class="muted small">Dikelompokkan berdasarkan fungsi jabatan</div></div></div>${groups.map((g,i)=>{const a=cards.filter(c=>roleOf(c).group===g),v=a.filter(c=>calculate(c).ready).length;return `<div class="barrow"><span>${g}</span><div class="track"><div class="bar ${i===1?'green':i===2?'gold':''}" style="width:${a.length?v/a.length*100:0}%"></div></div><strong class="right">${v}/${a.length}</strong></div>`;}).join('')}<div class="metric-note">Data belum lengkap tidak dihitung sebagai nilai nol.</div></section><section class="card"><div class="cardhead"><h2>Perlu ditindaklanjuti</h2></div><div class="event"><strong>${cards.length-ready.length} kontrak belum lengkap</strong><small>Periksa realisasi, bukti, status data, dan perilaku.</small></div><div class="event"><strong>${cards.filter(c=>calculate(c).qualityGate).length} kontrak perlu reviu kualitas</strong><small>Rating insentif mengikuti batas kualitas.</small></div><button class="btn tiny" onclick="nav('verification')">Lihat verifikasi</button></section></div><section class="card"><div class="cardhead"><div><h2>Penilaian pegawai</h2><div class="muted small">Enam kontrak pertama</div></div><button class="btn tiny" onclick="nav('reports')">Lihat semua</button></div>${tableCards(cards.slice(0,6))}</section><div class="notice info">Mode simulasi · Tersedia 16 pegawai contoh. Data tersimpan hanya pada browser ini.</div>`;}
function openCard(id){if(id){const c=data.cards.find(c=>c.id===id);if(!c)return;if(role==='PEGAWAI'&&c.employee!==activeEmployee)return toast('Pilih pegawai aktif yang sesuai.');activeCard=id;activeEmployee=c.employee;}else{activeCard=data.cards.find(c=>c.employee===activeEmployee)?.id||'';}activeMetric=0;tab='metrics';nav('scorecard');}
function canEdit(c){return ['DRAFT','REVISION'].includes(c.state)&&(role==='SDM'||(role==='PEGAWAI'&&c.employee===activeEmployee));}

function scorecard(){const c=currentCard();if(!c)return header('Pengisian KPI','Belum ada kontrak penilaian.')+'<section class="card empty">Tambahkan kontrak melalui Data pegawai terlebih dahulu.<br><button class="btn primary" style="margin-top:15px" onclick="nav(\'employees\')">Buka data pegawai</button></section>';if(role==='PEGAWAI'&&c.employee!==activeEmployee)return header('Pengisian KPI','Pilih pegawai yang mempunyai kontrak.');activeCard=c.id;const e=employee(c),r=roleOf(c),q=calculate(c),editable=canEdit(c),canContract=editable&&role==='SDM',n=q.rows.filter(x=>x.state!=='pending').length;activeMetric=Math.max(0,Math.min(5,activeMetric));const options=data.cards.filter(x=>x.employee===c.employee).map(x=>`<option value="${esc(x.id)}" ${x.id===c.id?'selected':''}>${esc(x.period)}</option>`).join('');
 const info=`<section class="card profile-summary"><div class="cardhead"><div class="profile"><div class="avatar">${esc(e.name.split(' ').slice(0,2).map(x=>x[0]).join(''))}</div><div><h2>${esc(e.name)}</h2><div class="context-meta">${esc(e.code)} · ${esc(c.employeeSnapshot.unit)}<br>${esc(r.name)}</div></div></div><div class="entry-context"><select aria-label="Periode kontrak" onchange="activeCard=this.value;activeMetric=0;render()">${options}</select>${badge(c.state)}</div></div>${c.comment?`<p class="helper"><strong>Catatan penilai:</strong> ${esc(c.comment)}</p>`:''}</section>`;
 const tabs=`<div class="tabs no-print" role="tablist" aria-label="Bagian penilaian">${[['metrics','Isi KPI'],['behavior','Perilaku'],['review','Periksa'],['events','Riwayat']].map(t=>`<button role="tab" aria-selected="${tab===t[0]}" class="tab ${tab===t[0]?'active':''}" onclick="setEntryTab('${t[0]}')">${t[1]}</button>`).join('')}</div>`;
 const stepper=`<section class="step-overview no-print"><div class="top"><strong>KPI ${activeMetric+1} dari 6</strong><span id="wizardProgress">${n} lengkap</span></div><div class="step-buttons">${c.metrics.map((m,i)=>{const v=q.rows[i];return `<button class="stepbtn ${v.state!=='pending'?'complete':''} ${i===activeMetric?'active':''}" id="stepBtn${i}" ${i===activeMetric?'aria-current="step"':''} onclick="moveMetric(${i})" aria-label="KPI ${i+1}: ${esc(v.def.name)}${v.state!=='pending'?', lengkap':''}"><span>${i+1}</span><span class="check" id="stepMark${i}">${v.state!=='pending'?'✓':''}</span></button>`;}).join('')}</div><div class="step-status">Isian tersimpan otomatis. Anda dapat berpindah langkah kapan saja.</div></section>`;
 const history=`<section class="card history-view"><h2>Riwayat penilaian</h2><div class="timeline">${[{at:c.created,action:'Kontrak dibuat',detail:c.period},...c.events].reverse().map(x=>`<div class="event"><strong>${esc(x.action)}</strong><div>${esc(x.detail||'')}</div><small>${date(x.at)}</small></div>`).join('')}</div></section>`;
 const actions=tab==='metrics'?`<div class="entry-actions no-print"><button class="btn" onclick="moveMetric(${activeMetric-1})" ${activeMetric===0?'disabled':''}>← Kembali</button><span class="action-text" data-save-state>Tersimpan di browser</span><div class="actions-right"><button class="btn save-only" onclick="saveEntry()">Simpan draf</button><button class="btn primary" onclick="moveEntry()">${activeMetric===5?'Periksa isian':editable?'Simpan & lanjut':'Lanjut'} →</button></div></div>`:'';
 return `<div class="entry-header"><div><div class="eyebrow">PENILAIAN PEGAWAI</div><h1>Pengisian KPI</h1></div><div class="actions no-print"><span class="save-state" data-save-state>Tersimpan di browser</span><button class="btn" onclick="contextDialog()">Ganti pegawai</button></div></div>${info}${mobileScoreSummary(q)}<div class="entry-shell"><div class="entry-main" id="entryAnchor">${tabs}${tab==='metrics'?stepper+`<div class="wizard-print-hidden">${metricForm(c,c.metrics[activeMetric],activeMetric,editable,canContract)}</div>`+actions+`<p class="entry-note">${editable?'Lengkapi realisasi dan bukti, lalu pilih status data. Bagian yang belum lengkap tetap dapat disimpan sebagai draf.':'Kontrak ini terkunci. Untuk perbaikan, penilai perlu mengembalikannya ke status Revisi.'}</p>`:tab==='behavior'?behaviorForm(c,editable):tab==='review'?reviewEntry(c,q):history}${printMetrics(c,q)}</div>${summaryAside(c,q)}</div>`;
}
function metricForm(c,m,i,editable,contract){const d=roleOf(c).metrics.find(x=>x.id===m.code),v=metricScore(m,d),label=d.type==='Z'?'Jumlah pelanggaran terverifikasi':`Realisasi (${d.unit})`;return `<section class="entry-card"><div class="kpihead"><div><div class="kpicode">${m.code} · ${esc(d.unit)}${d.quality?' · KUALITAS UTAMA':''}</div><strong>${esc(d.name)}</strong></div><span class="badge blue" id="weightBadge">Bobot ${fmt(m.weight*100,0)}%</span></div><div class="kpibody"><p class="definition">${esc(d.definition)}</p><div class="target-reference"><div class="reference-box"><label>Target kontrak</label><strong id="targetReference">${entryNumber(m.target,d.unit)} <small>${esc(d.unit)}</small></strong></div><div class="reference-box"><label>Jenis pengukuran</label><strong>${{A:'Makin tinggi',Q:'Pemenuhan',L:'Makin rendah',Z:'Kontrol wajib'}[d.type]} <small>(${d.type})</small></strong></div></div><div class="fieldgroup main-field"><label for="actual${i}">${esc(label)} <span class="required">*</span></label><div class="actual-wrap"><input id="actual${i}" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="next" aria-describedby="actualPreview${i} actualError${i}" value="${esc(entryNumber(m.actual,d.unit))}" ${inputAttr(!editable)} placeholder="Masukkan angka" oninput="editLocalizedActual(${i},this.value)" onblur="formatActualInput(${i},this)"><span class="input-unit">${esc(d.unit)}</span></div><div class="number-preview" id="actualPreview${i}">${m.actual===null?'Belum ada realisasi.':`Terbaca: ${entryNumber(m.actual,d.unit)} ${esc(d.unit)}`}</div><div class="field-error" id="actualError${i}" role="status"></div><div class="helper">${d.type==='Z'?'Isi 0 bila tidak ada pelanggaran dan register telah diperiksa. Kosong bukan berarti nol.':d.unit==='%'?'Isi 98 untuk 98%. Desimal dapat ditulis 98,5.':d.unit==='Rp'?'Gunakan rupiah penuh. Contoh: 1.500.000.000.':`Gunakan jumlah ${esc(d.unit)} sesuai laporan sumber.`}</div></div><div class="fieldgroup"><label for="evidence${i}">Referensi bukti <span class="required">*</span></label><textarea id="evidence${i}" rows="2" ${inputAttr(!editable)} placeholder="Nomor laporan, tanggal, nomor tiket, atau lokasi arsip" oninput="editMetric(${i},'evidence',this.value)">${esc(m.evidence)}</textarea><div class="helper">${esc(d.source)}. Yang disimpan adalah referensi, bukan berkas unggahan.</div></div><div class="fieldgroup"><label for="status${i}">Status data <span class="required">*</span></label><select id="status${i}" ${inputAttr(!editable)} onchange="editMetric(${i},'status',this.value);render()">${[['TUNDA','Belum lengkap / belum diperiksa'],['VALID','Data lengkap dan sudah diperiksa'],['TIDAK_BERLAKU','Tidak berlaku pada periode ini']].map(x=>`<option value="${x[0]}" ${m.status===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div>${m.status==='TIDAK_BERLAKU'?`<div class="fieldgroup"><label for="naReason${i}">Alasan tidak berlaku <span class="required">*</span></label><textarea id="naReason${i}" ${inputAttr(!editable)} oninput="editMetric(${i},'reason',this.value)">${esc(m.reason)}</textarea></div><div class="fieldgroup"><label for="naApproved${i}"><input id="naApproved${i}" type="checkbox" ${m.naApproved?'checked':''} ${inputAttr(role!=='SDM'||!editable)} onchange="editMetric(${i},'naApproved',this.checked)"> Pengecualian disetujui SDM (simulasi)</label><div class="helper">Bobot hanya dikecualikan setelah alasan dan persetujuan lengkap.</div></div>`:''}<details class="contract-details"><summary>${contract?'Atur target dan bobot kontrak':'Lihat rumus dan ketentuan'}</summary><p class="helper">${esc(typeGuide(d.type))}</p>${contract?`<div class="contract-grid"><div class="fieldgroup"><label for="target${i}">Target (${esc(d.unit)})</label><input id="target${i}" type="text" inputmode="decimal" value="${esc(entryNumber(m.target,d.unit))}" oninput="editLocalizedContract(${i},this.value)"></div><div class="fieldgroup"><label for="weight${i}">Bobot (%)</label><input id="weight${i}" type="number" inputmode="decimal" min="1" max="100" value="${fmt(m.weight*100,0)}" oninput="editMetric(${i},'weight',this.value)"></div></div><div class="inline-help">Total bobot enam KPI harus 100%. Target katalog masih berupa contoh dan perlu disepakati.</div>`:''}</details><div class="kpiresult"><span>Skor indikator<strong id="metricScore${i}">${fmt(v.score)}</strong></span><span>Nilai berbobot<strong id="metricWeighted${i}">${v.state==='valid'?fmt(v.score*m.weight):'—'}</strong></span><span class="metric-state muted" id="metricMsg${i}">${esc(v.state==='na'?'Tidak berlaku disetujui':v.message||'Data lengkap')}</span></div></div></section>`;}
function behaviorForm(c,editable){const allow=role==='SDM'&&editable;return `<section class="card"><div class="cardhead"><div><h2>Penilaian perilaku</h2><div class="helper">Pilih nilai pada setiap aspek. Nilai 3 berarti memenuhi standar.</div></div></div>${!allow?'<div class="notice info">Bagian ini diisi penilai SDM pada prototipe. Ganti peran melalui menu pegawai bila ingin mencoba.</div>':''}${BARS.map((b,i)=>`<div class="fieldgroup"><label>${i+1}. ${b}</label><div class="behavior-choices" role="group" aria-label="${esc(b)}">${[1,2,3,4,5].map(x=>`<button class="behavior-choice ${c.behavior[i]===x?'active':''}" aria-label="${esc(b)} nilai ${x}" aria-pressed="${c.behavior[i]===x}" ${inputAttr(!allow)} onclick="editBehavior(${i},'${x}');render()">${x}</button>`).join('')}</div><div class="behavior-caption">${c.behavior[i]?['Belum sesuai dan berdampak','Belum konsisten','Memenuhi standar','Melampaui standar','Perbaikan berdampak terukur'][c.behavior[i]-1]:'Belum dinilai'}</div></div>`).join('')}<div class="fieldgroup"><label for="behaviorEvidence">Bukti perilaku dan kontribusi tambahan</label><textarea id="behaviorEvidence" ${inputAttr(!allow)} placeholder="Catat kejadian, tindakan, dan dampaknya." oninput="editBehaviorProof(this.value)">${esc(c.behaviorEvidence)}</textarea><div class="helper">Nilai 1–2 dan 4–5 perlu bukti. Konversi: 1 = 0, 2 = 50, 3 = 100, 4 = 110, 5 = 120.</div></div><button class="btn primary" onclick="setEntryTab('review')">Periksa penilaian →</button></section>`;}
function editMetric(i,key,value){const c=currentCard();if(!canEdit(c))return;if(['target','weight'].includes(key)&&role!=='SDM')return;if(key==='naApproved'&&role!=='SDM')return;const m=c.metrics[i];m[key]=['target','actual','weight'].includes(key)?value===''?(key==='actual'?null:0):Number(value)/(key==='weight'?100:1):value;const ok=persist();syncSavedState(ok);updateScores();clearTimeout(saveTimer);saveTimer=setTimeout(()=>{log('Input KPI disimpan',employee(c).name+' · '+m.code+' · '+key);},900);}
function editBehavior(i,value){const c=currentCard();if(role!=='SDM'||!canEdit(c))return;c.behavior[i]=value===''?null:Number(value);persist();updateScores();}
function editBehaviorProof(value){const c=currentCard();if(role!=='SDM'||!canEdit(c))return;c.behaviorEvidence=value;persist();updateScores();}
function updateScores(){const c=currentCard(),q=calculate(c);for(const [id,v]of [['resultScore',fmt(q.result)],['behaviorScore',fmt(q.behavior)],['finalScore',fmt(q.final)],['ratingScore',q.rating],['calcMessage',q.message|| (q.qualityGate?'Batas kualitas bisnis berlaku.':'Seluruh syarat penghitungan terpenuhi.')],['mobileFinal',fmt(q.final)],['mobileResult',fmt(q.result)],['mobileBehavior',fmt(q.behavior)],['mobileRating',q.rating],['mobileProgress',q.rows.filter(x=>x.state!=='pending').length+' / 6'],['mobileCalc',q.message||'Seluruh syarat penghitungan terpenuhi.']]){const el=document.getElementById(id);if(el)el.textContent=v;}q.rows.forEach((x,i)=>{const e=document.getElementById('metricScore'+i);if(e)e.textContent=fmt(x.score);const w=document.getElementById('metricWeighted'+i);if(w)w.textContent=x.state==='valid'?fmt(x.score*x.m.weight):'—';const m=document.getElementById('metricMsg'+i);if(m)m.textContent=x.state==='na'?'Tidak berlaku disetujui':x.message||'Data lengkap';const b=document.getElementById('stepBtn'+i);b?.classList.toggle('complete',x.state!=='pending');const mark=document.getElementById('stepMark'+i);if(mark)mark.textContent=x.state!=='pending'?'✓':'';});const n=q.rows.filter(x=>x.state!=='pending').length;for(const[id,val]of[['sideProgress',n+' / 6'],['wizardProgress',n+' lengkap']]){const e=document.getElementById(id);if(e)e.textContent=val;}const bar=document.getElementById('sideProgressBar');if(bar)bar.style.width=n/6*100+'%';const warning=document.getElementById('weightWarning');if(warning)warning.textContent=`Bobot kontrak ${fmt(q.total*100,0)}% · Bobot valid ${fmt(q.coverage*100,0)}%`;const current=c.metrics[activeMetric],def=roleOf(c).metrics.find(x=>x.id===current.code),ref=document.getElementById('targetReference');if(ref)ref.textContent=entryNumber(current.target,def.unit)+' '+def.unit;const wb=document.getElementById('weightBadge');if(wb)wb.textContent='Bobot '+fmt(current.weight*100,0)+'%';}
function cardEvent(c,action,detail){c.events.push({at:new Date().toISOString(),action,detail,actor:role});log(action,employee(c).name+' · '+c.period+' · '+detail);}
function submitCard(){const c=currentCard();if(!canEdit(c))return;const q=calculate(c);if(!q.ready)return toast(q.message);confirmDialog('Ajukan penilaian','Kontrak dikunci untuk perubahan sampai atasan mengembalikan revisi. Nilai akhir sementara '+fmt(q.final)+'.',()=>{c.state='SUBMITTED';cardEvent(c,'Penilaian diajukan','Menunggu pemeriksaan atasan.');render();toast('Penilaian diajukan. Ganti peran simulasi ke Atasan untuk mencoba verifikasi.');});}
function catalog(){let list=CATALOG.filter(r=>!catRole||r.id===catRole).flatMap(r=>r.metrics.map(m=>({...m,role:r}))).filter(m=>(m.name+' '+m.definition+' '+m.role.name).toLowerCase().includes(catSearch.toLowerCase()));const pages=Math.max(1,Math.ceil(list.length/10));catPage=Math.min(catPage,pages);return header('Katalog KPI terukur','96 indikator untuk 16 jabatan. Total bobot standar per jabatan 100%.')+`<div class="card"><div class="toolbar"><input placeholder="Cari indikator atau jabatan..." aria-label="Cari KPI" value="${esc(catSearch)}" oninput="catSearch=this.value;catPage=1;renderCatalogBody()"><select aria-label="Filter jabatan" onchange="catRole=this.value;catPage=1;render()"><option value="">Semua jabatan</option>${CATALOG.map(r=>`<option value="${r.id}" ${catRole===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select></div><div id="catalogBody">${catalogTable(list,pages)}</div></div><div class="notice info">Target katalog adalah simulasi. Penetapan target aktual memperhatikan RBB, baseline, kapasitas kerja, kompleksitas tugas, dan batas risiko.</div>`;}
function catalogTable(list,pages){const slice=list.slice((catPage-1)*10,catPage*10);return `<div class="catalog-desktop tablewrap"><table><thead><tr><th>Kode / jabatan</th><th>Indikator dan definisi</th><th>Jenis</th><th class="number">Bobot</th><th>Target contoh</th></tr></thead><tbody>${slice.map(m=>`<tr><td><strong>${m.id}</strong><div class="muted small" style="min-width:140px">${esc(m.role.name)}</div></td><td><button class="rowlink" onclick="metricDetail('${m.id}')">${esc(m.name)}</button><div class="small muted" style="min-width:260px;max-width:600px">${esc(m.definition)}</div></td><td>${badge(m.type,'blue')}</td><td class="number">${fmt(m.weight*100,0)}%</td><td>${entryNumber(m.target,m.unit)} ${esc(m.unit)}<div class="small muted">${esc(m.targetNote)}</div></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Tidak ada KPI sesuai pencarian.</td></tr>'}</tbody></table></div><div class="catalog-tiles">${slice.map(m=>`<article class="catalog-tile"><div class="tile-meta"><span>${m.id} · ${esc(m.role.name)}</span>${badge(m.type,'blue')}</div><h3>${esc(m.name)}</h3><p>${esc(m.definition)}</p><div class="tile-values"><span>Bobot <strong>${fmt(m.weight*100,0)}%</strong></span><span>Target <strong>${entryNumber(m.target,m.unit)} ${esc(m.unit)}</strong></span></div><button class="btn tiny" style="margin-top:13px;width:100%" onclick="metricDetail('${m.id}')">Lihat rumus dan ketentuan</button></article>`).join('')||'<div class="empty">Tidak ada KPI sesuai pencarian.</div>'}</div>${pager(catPage,pages,list.length,'catPage')}`;}
function renderCatalogBody(){const list=CATALOG.filter(r=>!catRole||r.id===catRole).flatMap(r=>r.metrics.map(m=>({...m,role:r}))).filter(m=>(m.name+' '+m.definition+' '+m.role.name).toLowerCase().includes(catSearch.toLowerCase()));document.getElementById('catalogBody').innerHTML=catalogTable(list,Math.max(1,Math.ceil(list.length/10)));}
function pager(page,pages,n,key){return `<div class="pagination"><span>${n} data · Halaman ${page} / ${pages}</span><button onclick="${key}=Math.max(1,${page-1});render()" ${page===1?'disabled':''}>Sebelumnya</button><button class="active">${page}</button><button onclick="${key}=Math.min(${pages},${page+1});render()" ${page===pages?'disabled':''}>Berikutnya</button></div>`;}
function metricDetail(id){const r=CATALOG.find(r=>r.metrics.some(m=>m.id===id)),m=r.metrics.find(m=>m.id===id);modal('Definisi KPI '+m.id,`<h3>${esc(m.name)}</h3><p>${esc(m.definition)}</p><p class="small"><strong>Sumber:</strong> ${esc(m.source)}</p><p class="small"><strong>Target contoh:</strong> ${esc(m.targetNote)}</p><p class="small"><strong>Jenis ${m.type}:</strong> ${esc(typeGuide(m.type))}</p><p class="small muted">${esc(r.note)}</p>`,`<button class="btn" onclick="closeModal()">Tutup</button>`);}
function typeGuide(type){return {A:'Skor 100 × realisasi ÷ target; maksimum 120, minimum 0.',Q:'Skor 100 × realisasi ÷ target; maksimum 100, minimum 0.',L:'Skor 100 × (2 − realisasi ÷ target); maksimum 100, minimum 0.',Z:'Target 0. Skor 100 untuk nol pelanggaran terverifikasi, 0 bila ada pelanggaran.'}[type];}
function employees(){const all=data.employees.filter(e=>(e.name+' '+e.code+' '+e.unit).toLowerCase().includes(empSearch.toLowerCase())),pages=Math.max(1,Math.ceil(all.length/10));empPage=Math.min(empPage,pages);return header('Data pegawai','Identitas tetap terhubung dengan jabatan dan kontrak penilaian.',role==='SDM'?'<button class="btn primary" onclick="employeeDialog()">Tambah pegawai</button>':'')+`<section class="card"><div class="toolbar"><input placeholder="Cari nama, kode, atau unit..." aria-label="Cari pegawai" value="${esc(empSearch)}" onchange="empSearch=this.value;empPage=1;render()"></div><div class="tablewrap"><table><thead><tr><th>Pegawai</th><th>Unit</th><th>Jabatan</th><th>Kontrak</th><th>Tindakan</th></tr></thead><tbody>${all.slice((empPage-1)*10,empPage*10).map(e=>`<tr><td><strong>${esc(e.name)}</strong><div class="small muted">${esc(e.code)} · ${esc(e.id)}</div></td><td>${esc(e.unit)}</td><td>${esc(CATALOG.find(r=>r.id===e.role).name)}</td><td>${data.cards.filter(c=>c.employee===e.id).length}</td><td><div class="actions">${role==='SDM'?`<button class="btn tiny" onclick="employeeDialog('${e.id}')">Edit</button><button class="btn tiny" onclick="newContract('${e.id}')">Kontrak baru</button>`:''}<button class="btn tiny" onclick="activeEmployee='${e.id}';openCard()">Scorecard</button></div></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Pegawai tidak ditemukan.</td></tr>'}</tbody></table></div>${pager(empPage,pages,all.length,'empPage')}</section>`;}
function employeeDialog(id){if(role!=='SDM')return;const e=data.employees.find(e=>e.id===id)||{name:'',code:'',unit:'',role:'J01'};modal(id?'Edit pegawai':'Tambah pegawai',`<form id="employeeForm" onsubmit="saveEmployee(event,'${id||''}')"><div class="formgrid"><div class="fieldgroup"><label for="empCode">Kode pegawai</label><input id="empCode" name="code" required maxlength="50" value="${esc(e.code)}"></div><div class="fieldgroup"><label for="empName">Nama</label><input id="empName" name="name" required maxlength="150" value="${esc(e.name)}"></div><div class="fieldgroup"><label for="empUnit">Unit kerja</label><input id="empUnit" name="unit" required maxlength="150" value="${esc(e.unit)}"></div><div class="fieldgroup"><label for="empRole">Jabatan</label><select id="empRole" name="role">${CATALOG.map(r=>`<option value="${r.id}" ${r.id===e.role?'selected':''}>${esc(r.name)}</option>`).join('')}</select></div></div><p class="small muted">Perubahan jabatan tidak mengubah kontrak lama. Buat kontrak periode baru untuk jabatan baru.</p></form>`,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" type="submit" form="employeeForm">Simpan pegawai</button>`);}
function saveEmployee(ev,id){ev.preventDefault();if(role!=='SDM')return;const f=new FormData(ev.target),code=f.get('code').trim(),name=f.get('name').trim(),unit=f.get('unit').trim();if(!code||!name||!unit)return toast('Lengkapi kode, nama, dan unit.');if(data.employees.some(e=>e.code===code&&e.id!==id))return toast('Kode pegawai sudah digunakan.');const old=data.employees.find(e=>e.id===id),e={id:id||uid(),code,name,unit,role:f.get('role')};if(old)Object.assign(old,e);else data.employees.push(e);log(old?'Data pegawai diperbarui':'Pegawai ditambahkan',name);closeModal();render();toast('Data pegawai disimpan.');}
function newContract(id){if(role!=='SDM')return;const e=data.employees.find(e=>e.id===id);modal('Kontrak penilaian baru',`<form id="contractForm" onsubmit="saveContract(event,'${id}')"><p>${esc(e.name)} · ${esc(CATALOG.find(r=>r.id===e.role).name)}</p><div class="fieldgroup"><label for="newPeriod">Nama periode</label><input id="newPeriod" name="period" required placeholder="Contoh: 2027-S1" maxlength="60"></div><div class="notice">Target awal ditarik dari katalog contoh. Sesuaikan dengan periode kontrak; target tahunan tidak otomatis menjadi target semester.</div></form>`,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" form="contractForm" type="submit">Buat kontrak</button>`);}
function saveContract(ev,id){ev.preventDefault();if(role!=='SDM')return;const period=new FormData(ev.target).get('period').trim();if(!period)return;if(data.cards.some(c=>c.employee===id&&c.period===period))return toast('Kontrak untuk pegawai dan periode ini sudah ada.');const c=makeCard(data.employees.find(e=>e.id===id),period);data.cards.push(c);log('Kontrak dibuat',employee(c).name+' · '+period);closeModal();openCard(c.id);}
function verification(){const all=visibleCards().filter(c=>!verifyFilter||c.state===verifyFilter);return header('Verifikasi penilaian','Periksa bukti, konsistensi target, dan catatan sebelum finalisasi.')+`<div class="notice info">Pilihan peran adalah simulasi alur. SDM dapat memfinalisasi kontrak yang sudah diverifikasi Atasan. Perubahan pada browser ini tidak dikirim ke pihak lain.</div><section class="card"><div class="toolbar"><select aria-label="Filter status verifikasi" onchange="verifyFilter=this.value;render()"><option value="">Semua status</option>${Object.entries(STATES).map(([k,v])=>`<option value="${k}" ${verifyFilter===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="tablewrap"><table><thead><tr><th>Pegawai dan periode</th><th>Hasil</th><th>Status</th><th>Tindakan</th></tr></thead><tbody>${all.map(c=>{const q=calculate(c);return `<tr><td><strong>${esc(employee(c).name)}</strong><div class="small muted">${esc(c.period)} · ${esc(roleOf(c).name)}</div></td><td>${fmt(q.final)}<div>${ratingBadge(q.rating)}</div></td><td>${badge(c.state)}</td><td><div class="actions"><button class="btn tiny" onclick="openCard('${c.id}')">Periksa</button>${c.state==='SUBMITTED'&&role==='ATASAN'?`<button class="btn tiny primary" onclick="reviewDialog('${c.id}','VERIFIED')">Verifikasi</button><button class="btn tiny danger" onclick="reviewDialog('${c.id}','REVISION')">Minta revisi</button>`:''}${c.state==='VERIFIED'&&role==='SDM'?`<button class="btn tiny primary" onclick="reviewDialog('${c.id}','FINAL')">Finalisasi</button><button class="btn tiny" onclick="reviewDialog('${c.id}','REVISION')">Kembalikan</button>`:''}</div></td></tr>`;}).join('')}</tbody></table></div></section>`;}
function reviewDialog(id,next){const c=data.cards.find(c=>c.id===id);if(!canTransition(c,next))return toast('Peran atau status belum sesuai.');modal(next==='REVISION'?'Permintaan revisi':next==='FINAL'?'Finalisasi penilaian':'Verifikasi atasan',`<form id="reviewForm" onsubmit="saveReview(event,'${id}','${next}')"><p><strong>${esc(employee(c).name)}</strong> · ${esc(c.period)}</p><div class="fieldgroup"><label for="reviewComment">Catatan pemeriksaan</label><textarea id="reviewComment" name="comment" required placeholder="Ringkas hasil pemeriksaan atau hal yang perlu diperbaiki."></textarea></div>${next!=='REVISION'?'<label class="small"><input name="checked" type="checkbox" required> Saya telah memeriksa data, referensi bukti, dan kelayakan pengecualian.</label>':''}</form>`,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" form="reviewForm" type="submit">${next==='REVISION'?'Kirim revisi':next==='FINAL'?'Tetapkan final':'Verifikasi'}</button>`);}
function canTransition(c,next){return c&&((c.state==='SUBMITTED'&&role==='ATASAN'&&['VERIFIED','REVISION'].includes(next))||(c.state==='VERIFIED'&&role==='SDM'&&['FINAL','REVISION'].includes(next)));}
function saveReview(ev,id,next){ev.preventDefault();const c=data.cards.find(c=>c.id===id);if(!canTransition(c,next))return;const f=new FormData(ev.target),comment=f.get('comment').trim();if(!comment)return toast('Catatan wajib diisi.');if(next!=='REVISION'&&!calculate(c).ready)return toast('Data penilaian belum lengkap.');c.comment=comment;c.state=next;c.reviews.push({at:new Date().toISOString(),role,next,comment,score:calculate(c).final});cardEvent(c,next==='VERIFIED'?'Atasan memverifikasi':next==='FINAL'?'Penilaian ditetapkan final':'Revisi diminta',comment);closeModal();render();toast('Status penilaian diperbarui.');}
function appeals(){const list=data.appeals.filter(a=>role!=='PEGAWAI'||data.cards.find(c=>c.id===a.card)?.employee===activeEmployee);return header('Banding penilaian','Permohonan, bukti, dan keputusan dicatat dalam histori.',`<button class="btn primary" onclick="appealDialog()">Ajukan banding</button>`)+`<section class="card"><div class="tablewrap"><table><thead><tr><th>Pegawai dan periode</th><th>Permohonan</th><th>Status</th><th>Keputusan</th><th></th></tr></thead><tbody>${list.map(a=>{const c=data.cards.find(c=>c.id===a.card);return `<tr><td><strong>${esc(employee(c).name)}</strong><div class="small muted">${esc(c.period)}<br>${date(a.created)}</div></td><td style="max-width:350px">${esc(a.reason)}<div class="small muted">Bukti: ${esc(a.evidence)}</div></td><td>${badge(a.state)}</td><td style="max-width:280px">${esc(a.decision||'Belum diputus')}</td><td>${a.state==='OPEN'&&role==='SDM'?`<button class="btn tiny" onclick="decideAppeal('${a.id}')">Tinjau</button>`:''}</td></tr>`;}).join('')||'<tr><td colspan="5" class="empty">Belum ada banding. Banding tersedia setelah penilaian berstatus Final.</td></tr>'}</tbody></table></div></section>`;}
function appealDialog(){const cards=visibleCards().filter(c=>c.state==='FINAL'&&!data.appeals.some(a=>a.card===c.id&&a.state==='OPEN'));if(!cards.length)return toast('Belum ada penilaian Final yang dapat diajukan banding.');modal('Ajukan banding',`<form id="appealForm" onsubmit="saveAppeal(event)"><div class="fieldgroup"><label>Kontrak penilaian</label><select name="card">${cards.map(c=>`<option value="${c.id}">${esc(employee(c).name)} · ${esc(c.period)}</option>`).join('')}</select></div><div class="fieldgroup"><label>Komponen dan alasan banding</label><textarea name="reason" required></textarea></div><div class="fieldgroup"><label>Referensi bukti pendukung</label><input name="evidence" required></div></form>`,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" form="appealForm" type="submit">Ajukan</button>`);}
function saveAppeal(ev){ev.preventDefault();const f=new FormData(ev.target),c=data.cards.find(c=>c.id===f.get('card'));if(!c||c.state!=='FINAL'||(role==='PEGAWAI'&&c.employee!==activeEmployee)||data.appeals.some(a=>a.card===c.id&&a.state==='OPEN'))return;const reason=f.get('reason').trim(),evidence=f.get('evidence').trim();if(!reason||!evidence)return toast('Alasan dan bukti wajib diisi.');data.appeals.unshift({id:uid(),card:c.id,reason,evidence,created:new Date().toISOString(),state:'OPEN',decision:'',history:[],before:{score:calculate(c).final,rating:calculate(c).rating}});cardEvent(c,'Banding diajukan',reason);closeModal();render();toast('Banding dicatat di browser ini.');}
function decideAppeal(id){if(role!=='SDM')return;const a=data.appeals.find(a=>a.id===id);modal('Keputusan banding',`<form id="decisionForm" onsubmit="saveDecision(event,'${id}')"><p>${esc(a.reason)}</p><div class="fieldgroup"><label>Keputusan</label><select name="decision"><option value="ACCEPTED">Terima dan buka revisi</option><option value="REJECTED">Tolak dengan alasan</option></select></div><div class="fieldgroup"><label>Alasan keputusan</label><textarea name="comment" required></textarea></div><p class="small muted">Banding diterima membuka revisi dan memerlukan verifikasi ulang. Nilai sebelum banding tetap tersimpan pada catatan permohonan.</p></form>`,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" form="decisionForm" type="submit">Simpan keputusan</button>`);}
function saveDecision(ev,id){ev.preventDefault();if(role!=='SDM')return;const a=data.appeals.find(a=>a.id===id);if(!a||a.state!=='OPEN')return;const f=new FormData(ev.target),comment=f.get('comment').trim();if(!comment)return;const state=f.get('decision');if(!['ACCEPTED','REJECTED'].includes(state))return;a.state=state;a.decision=comment;a.history.push({at:new Date().toISOString(),decision:state,comment});const c=data.cards.find(c=>c.id===a.card);if(state==='ACCEPTED'){c.state='REVISION';c.comment='Banding diterima: '+comment;}cardEvent(c,'Keputusan banding',state+' · '+comment);closeModal();render();}
function reports(){const cards=visibleCards().filter(c=>!reportUnit||c.employeeSnapshot.unit===reportUnit),ready=cards.filter(c=>calculate(c).ready);return header('Laporan dan cadangan data','Rekap penilaian dapat diunduh sebagai CSV atau dicetak ke PDF.',`<button class="btn" onclick="print()">Cetak / PDF</button><button class="btn primary" onclick="exportCSV()">Ekspor CSV</button>`)+`<div class="stats">${stat('Kontrak pada laporan',cards.length,'Sesuai filter unit')}${stat('Data lengkap',ready.length,'Nilai sementara maupun final')}${stat('Penilaian final',cards.filter(c=>c.state==='FINAL').length,'Telah melewati verifikasi')}${stat('Batas kualitas berlaku',cards.filter(c=>calculate(c).qualityGate).length,'Perlu penelaahan penilai','!',true)}</div><section class="card"><div class="toolbar"><select aria-label="Filter unit laporan" onchange="reportUnit=this.value;render()"><option value="">Semua unit</option>${[...new Set(data.cards.map(c=>c.employeeSnapshot.unit))].map(u=>`<option ${reportUnit===u?'selected':''}>${esc(u)}</option>`).join('')}</select><span class="small muted">Nilai kosong tidak dihitung sebagai nol.</span></div>${tableCards(cards)}</section><section class="card no-print"><div class="cardhead"><div><h2>Cadangan dan pemindahan data</h2><div class="muted small">Ekspor JSON mencakup pegawai, kontrak, bukti referensi, banding, dan histori lokal.</div></div></div><div class="actions"><button class="btn" onclick="exportJSON()">Unduh cadangan JSON</button>${role==='SDM'?'<button class="btn" onclick="document.getElementById(\'importFile\').click()">Impor cadangan JSON</button><button class="btn danger" onclick="resetDemo()">Pulihkan data contoh</button>':''}</div><p class="small muted">Impor mengganti seluruh data lokal setelah konfirmasi. Ekspor cadangan terlebih dahulu. Data tidak tersinkron otomatis antarbrowser atau komputer.</p></section>`;}
function safeCSV(v){let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function download(name,text,type){const blob=new Blob([text],{type}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function exportJSON(){download('Cadangan_KPI_BKK_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(data,null,2),'application/json');toast('Cadangan JSON disiapkan. Simpan di lokasi yang aman.');}
function exportCSV(){let rows=[['Kode pegawai','Nama','Unit kontrak','Jabatan kontrak','Periode','Status','Skor hasil','Perilaku','Nilai akhir','Rating','Bobot valid persen','Catatan']];for(const c of visibleCards().filter(c=>!reportUnit||c.employeeSnapshot.unit===reportUnit)){const q=calculate(c),e=employee(c);rows.push([e.code,e.name,c.employeeSnapshot.unit,roleOf(c).name,c.period,STATES[c.state],q.result??'',q.behavior??'',q.final??'',q.rating,q.coverage*100,q.message|| (q.qualityGate?'Batas kualitas berlaku':'')]);}download('Rekap_KPI_BKK.csv','\ufeff'+rows.map(r=>r.map(safeCSV).join(';')).join('\r\n'),'text/csv;charset=utf-8');log('Laporan CSV diekspor',rows.length-1+' kontrak.');}
function history(){const logs=role==='PEGAWAI'?data.logs.filter(l=>l.detail.includes(data.employees.find(e=>e.id===activeEmployee)?.name||'___')):data.logs;return header('Histori aktivitas','Catatan aktivitas lokal untuk menelusuri proses simulasi.')+`<div class="notice">Histori pada HTML ini dapat diubah melalui penyimpanan browser. Audit trail yang terkendali akan diterapkan di server pada aplikasi PHP 8.</div><section class="card"><div class="timeline">${logs.slice(0,100).map(l=>`<div class="event"><strong>${esc(l.action)}</strong><div>${esc(l.detail)}</div><small>${date(l.at)} · ${esc(l.actor)}</small></div>`).join('')||'<div class="empty">Belum ada aktivitas pada pegawai ini.</div>'}</div><div class="helper">Menampilkan maksimal 100 aktivitas terbaru. Cadangan JSON memuat hingga 3.000 catatan.</div></section>`;}
function guide(){return header('Panduan penggunaan','Alur uji coba Excel dan HTML sebelum aplikasi lengkap dengan PHP 8.')+`<section class="card"><h2>Mulai dari scorecard contoh</h2><ol><li>Pilih pegawai Contoh Pegawai 01 dan buka Scorecard individu.</li><li>Periksa contoh hasil 96,55, perilaku 106, dan nilai akhir 98,44.</li><li>Dalam peran SDM, sesuaikan target kontrak, realisasi, bobot, bukti, serta nilai perilaku.</li><li>Klik Ajukan verifikasi. Pilih peran Atasan untuk memverifikasi atau meminta revisi.</li><li>Pilih SDM untuk menetapkan penilaian Final. Coba pengajuan banding setelah finalisasi.</li><li>Ekspor CSV untuk rekap; unduh JSON untuk cadangan yang dapat diimpor kembali. Jika sudah mengisi versi HTML sebelumnya, ekspor JSON dari versi lama lalu impor melalui Laporan pada versi ini.</li></ol></section><div class="grid2 equal"><section class="card"><h2>Aturan skoring</h2>${['A','Q','L','Z'].map(t=>`<details><summary>Jenis ${t}</summary><p class="small">${typeGuide(t)}</p></details>`).join('')}<p class="small">Nilai akhir = 80% skor hasil + 20% perilaku. Hasil dinormalisasi dengan bobot valid setelah seluruh status lengkap; bobot valid minimal 70%. Nol penyebut atau data kosong menahan hasil.</p><p class="small">Rating: &lt;75 Perlu perbaikan; 75–&lt;90 Cukup; 90–100 Baik; &gt;100–&lt;103 Sangat baik; ≥103 Istimewa dengan syarat semua mutu mencapai target dan bukti kontribusi.</p><p class="small">Kualitas utama bisnis kurang dari 80 atau kontrol Z gagal membatasi rating insentif maksimal Baik. Nilai hitung tetap ditampilkan.</p></section><section class="card"><h2>Penyimpanan dan pengembangan berikutnya</h2><p class="small">Prototipe HTML bekerja lokal, tanpa akun, server, atau pengiriman pesan. Peran simulasi tidak memberikan perlindungan akses. Gunakan data contoh selama evaluasi alur.</p><p class="small">Data disimpan dalam localStorage. Memindahkan file HTML tidak otomatis membawa data. Gunakan JSON untuk memindahkan data; cadangan mengganti dataset lokal setelah pemeriksaan struktur.</p><p class="small">Bukti dalam prototipe berupa referensi teks, bukan berkas unggahan. Rekap dapat dicetak menjadi PDF melalui menu browser.</p><p class="small">Tahap berikutnya: aplikasi PHP 8 pada cabang rilis dan patch keamanan yang didukung, MySQL, autentikasi dan otorisasi server, penyimpanan bukti, audit trail, serta integrasi modular ke SIMPEG dan MIS.</p></section></div><section class="card"><h2>Cakupan katalog</h2><p class="small">Katalog mengacu pada Kajian KPI Pegawai BKK Jateng Terukur 2026. Enam indikator per jabatan dipertahankan dengan bobot dan formula yang sama pada Excel dan HTML. Contoh target nominal menggunakan rupiah penuh. Target, periode, serta definisi sumber harus disepakati sebelum penilaian aktual.</p><p class="small muted">Versi prototipe ${UI_VERSION} · 30 Oktober 2026. Identitas BKK disajikan sebagai teks dan monogram rancangan; logo resmi belum disertakan.</p></section>`;}
function modal(title,body,foot){const d=document.getElementById('modal');d.innerHTML=`<div class="dialoghead"><h2>${esc(title)}</h2><button class="close" onclick="closeModal()" aria-label="Tutup dialog">×</button></div><div class="dialogbody">${body}</div><div class="dialogfoot">${foot}</div>`;if(!d.open)d.showModal();}
function closeModal(){document.getElementById('modal').close();}
let confirmedAction=null;function confirmDialog(title,text,fn){confirmedAction=fn;modal(title,`<p>${esc(text)}</p>`,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="runConfirm()">Lanjutkan</button>`);}
function runConfirm(){const f=confirmedAction;confirmedAction=null;closeModal();if(f)f();}
function resetDemo(){if(role!=='SDM')return;confirmDialog('Pulihkan data contoh','Semua perubahan lokal akan diganti dengan data simulasi awal. Pastikan cadangan JSON sudah diunduh.',()=>{data=starter();activeEmployee=data.employees[0].id;activeCard='';persist();render();toast('Data contoh dipulihkan.');});}
document.getElementById('roleSelect').addEventListener('change',ev=>{role=ev.target.value;render();});
document.getElementById('staffSelect').addEventListener('change',ev=>{activeEmployee=ev.target.value;activeCard='';activeMetric=0;render();});
document.getElementById('importFile').addEventListener('change',async ev=>{const f=ev.target.files[0];if(!f)return;ev.target.value='';if(role!=='SDM')return;if(f.size>15*1024*1024)return toast('Ukuran cadangan maksimal 15 MB.');try{const incoming=validate(JSON.parse(await f.text()));confirmDialog('Impor cadangan',incoming.employees.length+' pegawai dan '+incoming.cards.length+' kontrak akan mengganti data lokal. Lanjutkan setelah membuat cadangan.',()=>{data=incoming;activeEmployee=data.employees[0]?.id||'';activeCard='';log('Cadangan diimpor',f.name);render();toast('Cadangan diimpor.');});}catch(e){toast('Impor ditolak: '+e.message);}});
window.addEventListener('beforeunload',()=>{persist();});
const UI_VERSION='1.1.0';
let activeMetric=0,lastSavedAt=null;
const ICONS={dashboard:'<rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/><rect x="3" y="14" width="7" height="7" rx="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.4"/>',scorecard:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M9 10h6M9 14h6M9 18h4"/>',catalog:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M3 9h18M12 13h5M12 16h5"/>',employees:'<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M17 5a3 3 0 0 1 0 6M18 15a5 5 0 0 1 3 5"/>',verification:'<path d="M12 3 3 7v6c0 5 9 9 9 9s9-4 9-9V7l-9-4Z"/><path d="m8 12 3 3 5-6"/>',appeals:'<path d="M4 8h15m-4-4 4 4-4 4M20 16H5m4-4-4 4 4 4"/>',reports:'<path d="M4 3v18h17M8 16v-5M13 16V7M18 16V4"/>',history:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/>',guide:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',user:'<circle cx="12" cy="8" r="3"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/>'};
function icon(name){return `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]||ICONS.guide}</svg>`;}
function drawer(open){const s=document.getElementById('sidebar');s.classList.toggle('open',open);document.getElementById('drawerScrim').classList.toggle('open',open);document.body.classList.toggle('drawer-open',open);s.setAttribute('aria-hidden',String(!open&&window.innerWidth<=760));if(open||window.innerWidth>760)s.removeAttribute('inert');else s.setAttribute('inert','');if(open){s.querySelector('.drawer-close').focus();}else{document.querySelector('.bottomnav button:last-child')?.focus();}}
function bottomNavigation(){return [['dashboard','Beranda'],['scorecard','Isi KPI'],['catalog','Katalog'],['menu','Lainnya']].map(([key,title])=>`<button class="${view===key?'active':''}" ${view===key?'aria-current="page"':''} onclick="${key==='menu'?'drawer(true)':key==='scorecard'?'openCard()':`nav('${key}')`}" aria-label="${title}"><span class="iconwrap">${icon(key)}</span><span>${title}</span></button>`).join('');}
function decorateTables(){document.querySelectorAll('.tablewrap table').forEach(t=>{const labels=Array.from(t.querySelectorAll('thead th')).map(x=>x.textContent.trim());if(!labels.length)return;t.querySelectorAll('tbody tr').forEach(tr=>Array.from(tr.children).forEach((td,i)=>td.setAttribute('data-label',labels[i]||'')));});}
function contextDialog(){modal('Pegawai dan peran aktif',`<div class="fieldgroup"><label for="contextEmployee">Pilih pegawai</label><select id="contextEmployee">${data.employees.map(e=>`<option value="${esc(e.id)}" ${e.id===activeEmployee?'selected':''}>${esc(e.name)} · ${esc(e.code)}</option>`).join('')}</select></div><div class="fieldgroup"><label for="contextRole">Peran simulasi</label><select id="contextRole"><option value="PEGAWAI" ${role==='PEGAWAI'?'selected':''}>Pegawai — isi realisasi</option><option value="ATASAN" ${role==='ATASAN'?'selected':''}>Atasan — verifikasi</option><option value="SDM" ${role==='SDM'?'selected':''}>SDM — kontrak dan finalisasi</option></select></div><p class="helper">Peran digunakan untuk mencoba alur. Prototipe ini belum menggunakan login server.</p>`,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="applyContext()">Terapkan</button>`);}
function applyContext(){activeEmployee=document.getElementById('contextEmployee').value;role=document.getElementById('contextRole').value;activeCard='';activeMetric=0;closeModal();render();}
function syncSavedState(ok){document.querySelectorAll('[data-save-state]').forEach(el=>{el.textContent=ok?'Tersimpan di browser':'Belum tersimpan';el.style.color=ok?'#39796a':'#b9354b';});if(ok)lastSavedAt=new Date();}
function entryNumber(v,unit){return v===null?'':Number(v).toLocaleString('id-ID',{maximumFractionDigits:2});}
function parseEntryNumber(raw){let t=String(raw).trim().replace(/\s+/g,'');if(!t)return null;if(!/^-?[\d.,]+$/.test(t))return NaN;if(t.includes(',')){if((t.match(/,/g)||[]).length!==1)return NaN;const [a,b]=t.split(',');if(b.includes('.'))return NaN;t=a.replace(/\./g,'')+'.'+b;}else if(/^-?\d{1,3}(\.\d{3})+$/.test(t)){t=t.replace(/\./g,'');}if(!/^-?(?:\d+\.?\d*|\.\d+)$/.test(t))return NaN;return Number(t);}
function editLocalizedActual(i,raw){const parsed=parseEntryNumber(raw);editMetric(i,'actual',Number.isFinite(parsed)?String(parsed):'');const error=document.getElementById('actualError'+i),input=document.getElementById('actual'+i),hint=document.getElementById('actualPreview'+i);const invalid=raw.trim()!==''&&!Number.isFinite(parsed);if(error)error.textContent=invalid?'Gunakan angka. Contoh: 1.500.000 atau 98,5.':'';input?.classList.toggle('field-invalid',invalid);input?.setAttribute('aria-invalid',String(invalid));const m=currentCard().metrics[i],d=roleOf(currentCard()).metrics.find(x=>x.id===m.code);if(hint)hint.textContent=Number.isFinite(parsed)?`Terbaca: ${entryNumber(parsed,d.unit)} ${d.unit}`:'Belum ada realisasi.';}
function formatActualInput(i,input){const m=currentCard()?.metrics[i];if(!m)return;const d=roleOf(currentCard()).metrics.find(x=>x.id===m.code);if(m.actual!==null&&Number.isFinite(m.actual))input.value=entryNumber(m.actual,d.unit);}
function editLocalizedContract(i,raw){const n=parseEntryNumber(raw);editMetric(i,'target',Number.isFinite(n)?String(n):'');}
function moveMetric(i){activeMetric=Math.max(0,Math.min(5,i));tab='metrics';render();document.getElementById('entryAnchor')?.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});}
function moveEntry(){const c=currentCard();if(canEdit(c)){const ok=persist();syncSavedState(ok);if(!ok)return;}if(activeMetric<5){moveMetric(activeMetric+1);}else{tab='review';render();document.getElementById('entryAnchor')?.scrollIntoView({behavior:'smooth',block:'start'});}}
function saveEntry(){if(!persist())return;toast('Draf tersimpan di browser ini.');syncSavedState(true);}
function setEntryTab(t){tab=t;render();document.getElementById('entryAnchor')?.scrollIntoView({behavior:'smooth',block:'start'});}
function mobileScoreSummary(q){return `<details class="mobile-summary"><summary><span>Ringkasan nilai <span class="chevron">⌄</span></span><span class="summary-total" id="mobileFinal">${fmt(q.final)}</span></summary><div class="scorepanel"><div><div class="label">Skor hasil · 80%</div><div class="big" id="mobileResult">${fmt(q.result)}</div></div><div><div class="label">Perilaku · 20%</div><div class="big" id="mobileBehavior">${fmt(q.behavior)}</div></div><div><div class="label">Rating efektif</div><div class="big" id="mobileRating">${q.rating}</div></div><div><div class="label">KPI lengkap</div><div class="big" id="mobileProgress">${q.rows.filter(x=>x.state!=='pending').length} / 6</div></div></div><div class="calc-note" id="mobileCalc">${esc(q.message|| (q.qualityGate?'Batas kualitas bisnis berlaku.':'Seluruh syarat penghitungan terpenuhi.'))}</div></details>`;}
function summaryAside(c,q){const n=q.rows.filter(x=>x.state!=='pending').length;return `<aside class="entry-side"><section class="card"><h3>Ringkasan penilaian</h3><div class="mini-score"><span class="muted">KPI lengkap</span><strong id="sideProgress">${n} / 6</strong></div><div class="track progressline"><div class="bar green" id="sideProgressBar" style="width:${n/6*100}%"></div></div><div class="mini-score"><span class="muted">Skor hasil · 80%</span><strong id="resultScore">${fmt(q.result)}</strong></div><div class="mini-score"><span class="muted">Perilaku · 20%</span><strong id="behaviorScore">${fmt(q.behavior)}</strong></div><div class="mini-score final"><span>Nilai akhir</span><strong id="finalScore">${fmt(q.final)}</strong></div><div id="ratingScore">${ratingBadge(q.rating)}</div><p class="helper" id="calcMessage">${esc(q.message||'Seluruh syarat penghitungan terpenuhi.')}</p><div class="helper" id="weightWarning">Bobot kontrak ${fmt(q.total*100,0)}% · Bobot valid ${fmt(q.coverage*100,0)}%</div></section><section class="card"><h3>Petunjuk singkat</h3><p class="helper">1. Isi realisasi sesuai satuan.<br>2. Cantumkan referensi bukti.<br>3. Pilih status data.<br>4. Periksa sebelum diajukan.</p><button class="btn tiny" onclick="setEntryTab('review')" style="width:100%">Periksa kelengkapan</button></section></aside>`;}
function reviewEntry(c,q){return `<section class="card"><div class="cardhead"><div><h2>Periksa sebelum diajukan</h2><div class="helper">KPI dan perilaku harus lengkap agar nilai akhir dapat dihitung.</div></div></div><ul class="review-list">${q.rows.map((x,i)=>`<li class="review-item"><span class="status-icon ${x.state==='pending'?'pending':''}">${x.state==='pending'?'!':'✓'}</span><div style="flex:1;min-width:0"><div class="title">${esc(x.def.name)}</div><div class="sub">${x.state==='na'?'Tidak berlaku disetujui':x.state==='valid'?`Realisasi ${entryNumber(x.m.actual,x.def.unit)} ${esc(x.def.unit)} · Skor ${fmt(x.score)}`:esc(x.message)}</div></div><button class="btn tiny" onclick="moveMetric(${i})">${x.state==='pending'?'Lengkapi':'Lihat'}</button></li>`).join('')}<li class="review-item"><span class="status-icon ${q.behavior===null?'pending':''}">${q.behavior===null?'!':'✓'}</span><div style="flex:1"><div class="title">Lima aspek perilaku</div><div class="sub">${q.behavior===null?'Belum lengkap. Diisi penilai SDM pada prototipe.':`Skor perilaku ${fmt(q.behavior)}`}</div></div><button class="btn tiny" onclick="setEntryTab('behavior')">Lihat</button></li></ul>${q.ready?`<div class="notice success" style="margin-top:18px">Data siap diajukan. Nilai akhir <strong>${fmt(q.final)}</strong> · ${q.rating}.</div>`:`<div class="notice" style="margin-top:18px">${esc(q.message)}</div>`}${q.qualityGate?'<div class="notice">Batas kualitas bisnis berlaku. Rating insentif maksimal Baik sampai hasil reviu.</div>':''}<div class="actions scorecard-actions no-print">${canEdit(c)?`<button class="btn primary" onclick="submitCard()" ${q.ready?'':'disabled'}>Ajukan verifikasi</button>`:''}<button class="btn" onclick="print()">Cetak ringkasan</button></div></section><details class="card"><summary>Ketentuan jabatan</summary><p class="helper">${esc(roleOf(c).note)}</p></details>`;}
function printMetrics(c,q){return `<section class="all-print-metrics" style="display:none"><h2>Rincian KPI</h2><table><thead><tr><th>Indikator</th><th>Target</th><th>Realisasi</th><th>Bobot</th><th>Skor</th></tr></thead><tbody>${q.rows.map(x=>`<tr><td>${esc(x.def.name)}<div>${esc(x.m.evidence)}</div></td><td>${entryNumber(x.m.target,x.def.unit)} ${x.def.unit}</td><td>${entryNumber(x.m.actual,x.def.unit)} ${x.def.unit}</td><td>${fmt(x.m.weight*100,0)}%</td><td>${fmt(x.score)}</td></tr>`).join('')}</tbody></table><p>Skor hasil ${fmt(q.result)} · Perilaku ${fmt(q.behavior)} · Nilai akhir ${fmt(q.final)} · Rating ${q.rating}</p></section>`;}

document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&document.getElementById('sidebar').classList.contains('open'))drawer(false);});
document.addEventListener('focusin',ev=>{if(ev.target.matches('input,textarea,select'))document.body.classList.add('keyboard-open');});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(!document.activeElement?.matches('input,textarea,select'))document.body.classList.remove('keyboard-open');},100);});
window.addEventListener('resize',()=>{if(window.innerWidth>760){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebar').removeAttribute('aria-hidden');document.getElementById('sidebar').removeAttribute('inert');document.getElementById('drawerScrim').classList.remove('open');document.body.classList.remove('drawer-open');}});

render();persist();
</script></body></html>
